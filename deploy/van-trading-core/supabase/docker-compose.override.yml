# Van overrides for the pinned Supabase donor compose.
# Security: all host-published ports are loopback-only.
# Authority: VATI ledger is reconciled only after the donor database bootstrap completes.
services:
  studio:
    ports: !override
      - "127.0.0.1:3000:3000"
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"
  db:
    ports: !override
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 3g
  supavisor:
    ports: !override
      - "127.0.0.1:5433:5432"
      - "127.0.0.1:6543:6543"
