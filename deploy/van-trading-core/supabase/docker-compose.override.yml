# Van overrides for the Supabase donor compose (never edit docker-compose.yml itself).
# - Every published port binds to loopback: the VM's security list already limits ingress to
#   the private VCN, and nothing on the trading VM needs Supabase from outside the host.
# - The VATI ledger schema is created on first boot from init/01_vati_ledger.sql.
# - Memory limits keep the trading process (T0) ahead of the database on a 12 GB host.
services:
  studio:
    ports: ["127.0.0.1:3000:3000"]
  kong:
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8443:8443"]
  db:
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./init/01_vati_ledger.sql:/docker-entrypoint-initdb.d/init-scripts/99-vati-ledger.sql:ro
    deploy:
      resources:
        limits:
          memory: 3g
  analytics:
    ports: ["127.0.0.1:4000:4000"]
    deploy:
      resources:
        limits:
          memory: 1g
  supavisor:
    ports: ["127.0.0.1:5433:5432", "127.0.0.1:6543:6543"]
