[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = backend trading trading/tests
# GAP-F-022 — backend/tests/test_owner_device_provisioning.py and
# tests/contracts/test_owner_device_provisioning.py share a basename with no __init__.py
# under either tests/ directory, so pytest's default (prepend) import mode inserts both
# into sys.modules under the same bare name ("test_owner_device_provisioning") and raises
# "import file mismatch" the moment both are collected in the same run (a whole-tree
# `pytest` from the repo root). CI never hit this because it runs each suite from its own
# directory.
#
# `--import-mode=importlib` was tried first, since it gives every module a name derived
# from its file path rather than a bare stem. It does not keep every suite green: several
# `trading/tests` modules rely on prepend mode's single canonical module identity per
# import path (a mandate registry and a signing key built once at import time), and under
# importlib mode the same source gets imported under two different module identities,
# which breaks an isinstance/identity check and fails owner-signature verification —
# `test_mandate.py` alone went from 31 passed to failing on the very first case. That is
# exactly the "keeps every suite green when run per-directory" bar this fix must clear, so
# importlib mode is out for the whole tree.
#
# `tests/contracts/__init__.py` (added alongside this file) is the fix instead: pytest's
# default mode then derives that file's module name by walking up while an `__init__.py`
# chain continues, giving it the dotted name `contracts.test_owner_device_provisioning`
# rather than the bare `test_owner_device_provisioning` the backend copy still claims — no
# collision, because the two names differ.
#
# `backend/tests/__init__.py` was tried too, for symmetry, and reverted: `backend/tests`
# holds `conftest_automation.py`, a plain (non-package) helper that 36 files import as
# `from conftest_automation import ...`. That import works today only because prepend mode
# adds a non-package test file's own directory to `sys.path`; making `backend/tests` a
# package removes that directory from `sys.path` in favour of its parent, and the bare
# import breaks — `backend/tests/test_mission_core.py` alone went from collecting to
# `ModuleNotFoundError: No module named 'conftest_automation'`. `tests/contracts` has no
# such sibling-import helper, so it does not have this problem.
#
# No import-mode change, so nothing about module identity elsewhere in the tree changes.
# Verified to keep every suite green both per-directory the way CI does (backend/tests,
# tests/contracts, services, hermes/policy/tests, tests/hermes, tests/scenarios,
# trading/tests) and from the repo root.
