  milestone_effect: TRACED_VECTOR_CANDIDATE_REJECTED
- id: CF-D-09
  status: ADOPTED
  date: '2026-09-25'
  authority: owner
  decision: 'M1 may be satisfied by a raster layer set cut from Candidate B''s own
    native pixels instead of a vector redraw (owner instruction 2026-09-25: ''use
    option 2''). Each rig part is a PNG layer, pixel-exact to the approved art, with
    painted underlap where other parts hide it, so the neutral pose recomposes to
    the source. The Rive rig deforms those images with triangle meshes skinned to
    bones (Rive CLI 1.1.1 ImageAsset + Image/Mesh/Skin). The identity lock, the 3.2
    +/- 0.3 head count, the Rive contract and every owner/device gate are unchanged.
    A vector redraw by an artist remains the long-term target and still satisfies
    M1 through vectors admit. Known costs: native resolution only (no invented detail),
    softer edges at extreme poses, a larger .riv.'
  milestone_effect: M1_ACCEPTS_RASTER_LAYER_SET
- id: CF-D-09-HYBRID
  status: ADOPTED
  date: '2026-09-25'
  authority: owner
  decision: 'The first raster layer set was judged bad by the owner (misassigned eyes,
    brows and goggle pixels; smeared fill in hidden regions). Owner instruction 2026-09-25:
    ''do a hybrid of option 1 and 2'' - (1) cut the face parts, sleeves and torso
    on hand-placed geometry measured on the approved cut-out rather than on the blockout,
    and (2) paint the hidden regions of each layer with an AI inpainting model (big-lama,
    pinned by SHA-256 in TOOLS.yaml) from that layer''s own pixels. Visible pixels
    stay Candidate B''s own; the neutral pose must still recompose to the source.
    The AI fill is labelled per layer in LAYERS.json and cached with its model hash
    in 02-ai-working. A human-painted layer set remains the route to final quality.'
  milestone_effect: RASTER_UNDERLAP_MAY_BE_AI_PAINTED
