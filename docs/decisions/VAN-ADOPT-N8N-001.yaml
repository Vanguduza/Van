  - owner-internal VAN automation
  - self-hosted on VAN Trading Core VM
  - not offered as a hosted workflow service to third parties
  - not exposed as a customer-facing embedded n8n product

commercial_boundary:
  external_customer_hosting: prohibited_without_re_review
  customer_embedding: prohibited_without_re_review
  resale_of_workflow_execution: prohibited_without_re_review

technical_boundary:
  executes_live_orders: false
  owner_authority: false
  project_truth_authority: false
  risk_authority: false
  canonical_memory_authority: false
  browser_semantic_authority: false
  t0_path_participation: false

