  workflow_lineage: van_owned
  evidence: van_owned
  admission: van_owned
  source_control: van_owned
  binary_evidence_storage: van_owned
  security_authority: van_owned

observed_runtime:
  design_time_observation: "2.39.6"
  deployment_branch_pin: "2.39.7"
  pin_status: UNPINNED_VERIFY_AT_ADOPTION
  verify_at_adoption: true

