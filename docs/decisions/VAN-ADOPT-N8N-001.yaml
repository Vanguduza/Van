licence: Sustainable Use License
licence_class: SOURCE_AVAILABLE
licence_note: >-
  n8n is source-available, not OSI open source. The Sustainable Use License permits internal
  business use and restricts hosting n8n as a service to third parties. Stack-lock principle 5
  requires an explicit owner-signed adoption decision for SOURCE_AVAILABLE, enforced by
  trading/tests/test_stack_lock.py::test_non_permissive_licences_require_owner_decision.

