# Review I2 N-7 — VAN-side gate on Jev (dial-jev PROPOSE_ACTION) browser effect. NOT owner-signed.
#
# This record holds no new decision. It records, in the form the production gate model reads,
# the state the owner has already set: DDS Programme B blueprint §11 — "no Jev module can carry
# effect today; PROPOSE_ACTION capped at SHADOW until a separate owner decision" — and owner
# decision 2026-09-29 §9 ("Jev never executes"; every machine lane feeds the Browser Harness).
#
# dial-jev's own response (`apply_effect: true` under an ACTIVE / ACTIVE_GATED lifecycle) is
# dial-jev reporting on itself. It is necessary for VAN to act on a Jev proposal and it is not
# sufficient: the VAN interaction router executes a Jev proposal only when the
# `jev_browser_effect` capability of registries/production_activation_gates.json is GREEN, i.e.
# when, in this record, `owner_signature_status` is SIGNED,
# `jev_browser_effect.owner_decision_reference` has the shape of a
# docs/decisions/OWNER-DECISIONS-*.md path (the model does not open it), and
# `jev_browser_effect.status` is OWNER_APPROVED_EFFECT -- *and* the Browser Harness and
# Security Policy decisions it inherits are GREEN. Until then every Jev proposal is a SHADOW
# proposal: re-validated, counted and compared, never executed.
#
# Changing `jev_browser_effect.status` requires that separate owner decision, recorded here as an
# append (the gate model's path then moves to the newer block). What the gate model checks is
# the content of this file, not who wrote it: it makes a one-line status edit insufficient
# (review I3 MINOR-4), but it cannot by itself stop an agent, CI or dial-jev that edits all
# three fields. The control against that is Project Truth owner authority over commits to
# docs/decisions/ (OWNER_EXPLICIT authorization record + PR review), not this record or the model.
decision_id: VAN-JEV-BROWSER-EFFECT-001
schema_version: 1
subject: dial-jev PROPOSE_ACTION effect on the VAN browser interaction router (lane 2)
owner_signature_status: NOT_APPLICABLE_RECORDS_EXISTING_CAP
authority:
  - DDS Programme B blueprint section 11 (PROPOSE_ACTION capped at SHADOW until a separate owner decision)
  - docs/decisions/OWNER-DECISIONS-20260929-STAGEHAND-PRIVATE-PLANE.md section 9
recorded_by: unit G3b (review I2 N-7)
recorded_at: "2026-09-29"

jev_browser_effect:
  # SHADOW_ONLY: Jev proposals are shadow comparisons only (pending the owner decision).
  # OWNER_APPROVED_EFFECT: the separate owner decision has been made (GREEN).
  # REVOKED: effect withdrawn after approval (BLOCKED).
  status: SHADOW_ONLY
  owner_decision_reference: null
