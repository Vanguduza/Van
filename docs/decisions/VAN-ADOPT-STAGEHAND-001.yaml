        CLOSED (review I3, VAN f55d360d). On /assignments, /interaction/step, the watch runner, the notebook consumer and automation dispatch, no lane result (done=True, GOAL_ACHIEVED, empty Stagehand controls, Jev done, engine success) yields COMPLETED/VERIFIED_SUCCESS; only WorkflowVerifier VERIFIED over a declared predicate (field/expected other than `exists`, or correlation keys each with a caller-declared expected value) does. BrowserTaskService.complete(COMPLETED) requires the latest recorded verdict to be VERIFIED; dispatch additionally requires the action receipt VERIFIED_SUCCESS with the engine execution id independently observed. Limits: (1) READ_BACK observes a page the site controls, so a declared title/URL/text proves what the page shows, not the server-side effect; (2) automation dispatch has no production observer, so every run is UNVERIFIABLE until one is qualified; (3) completion is refused while a router step or assignment run is in flight on the task, and is written only if the verdict it checked is still the task's latest (I3 MINOR-1, fixed by unit G4b; the in-flight marker is per gateway process).
    STAGEHAND-DIRECT-ACTUATION-20260929:
      status: CLOSED
      closes: owner_decisions_20260929.blockers.STAGEHAND-DIRECT-ACTUATION-20260929
      decision_section: 8
      limitation: >-
        CLOSED (review I3, VAN f55d360d). On every production caller Stagehand is used only via observe(); router lane 3 and HybridBrowserWorker turn one observed candidate into a typed click/fill/press/scroll that VAN classifies from the Harness-observed element and the Browser Harness executes. StagehandAdapter.act() refuses unless actuation_enabled, which production wiring never sets; the worker serves /act only on a HISTORICAL_DEV_ONLY placement, and the gate refuses a worker whose /health reports act_endpoint_enabled. Limits: (1) separation is process policy, not capability: the Stagehand 4.1.0 worker still attaches to the Harness-owned Chromium over a full CDP connection (stagehand_service.mjs:335), so a compromised worker could actuate; (2) Stagehand's autonomous act/agent modes stay outside production, which makes the NotebookLM consumer (notebook.py → act) non-functional in production; (3) the live Harness reports no element list, so every targeted Stagehand proposal currently goes to owner takeover.
  not_changed_by_this_block:
    - owner_decisions_20260929.production_gate.status (PENDING)
    - owner_decisions_20260929.signed_ingress.status (SIGNED_INGRESS_PENDING)
    - owner_decisions_20260929.hosting.zone_status (UNPROVISIONED => Stagehand PRODUCTION_DISABLED)
    - owner_decisions_20260929.model.pin_status (UNVERIFIED)
    - owner_decisions_20260929.version.live_qualification.status (PENDING)

# =====================================================================================
# APPENDED 2026-09-29 (fourth append) — correction to blocker_closure_20260929 after
# independent review I4. Append-only: every byte above this line is preserved unchanged.
# Review I4 found that the I3-MAJOR-3 disposition above ("Harness lease-generation fence")
# overstated the fence: at VAN 65865d00 it worked one way only (MINOR-A). This block records
# what the fence covers after unit G5b's fix, and one wording correction. It does not reopen
# either blocker (both stay CLOSED; the gate model's blocker paths are unchanged) and changes
# no product, security, money, provider or owner-control intent.
# Authority class: OWNER_DERIVED (the owner ordered the review findings closed by the runtime
# work: docs/decisions/OWNER-DECISIONS-20260929-STAGEHAND-PRIVATE-PLANE.md sections 8-10).
# =====================================================================================
blocker_closure_correction_20260929:
  authority_class: OWNER_DERIVED
  authority_basis:
    owner_record: docs/decisions/OWNER-DECISIONS-20260929-STAGEHAND-PRIVATE-PLANE.md
    owner_record_sha256: 64f1c0560ef88776d0d199392d315767ea3576827e335ba2da8081d12e307c81
    owner_sections: [8, 9, 10]
  signature_claimed: none
  corrects: blocker_closure_20260929.follow_up_findings_from_the_same_review[I3-MAJOR-3].disposition
  independent_review:
    id: I4
    reviewed_commit: 65865d00
    finding: I4-MINOR-A
    evidence_probe: review-i4/probes/test_i4_fence.py (held outside this repository)
    fixed_by: unit G5b, VAN 529619bd
    reproduced_at_65865d00: >-
      (1) a /step whose lease lapsed and was re-taken by task2 still clicked on task2's page
      and returned VERIFIED_SUCCESS; (2) /assignments Harness calls carried no lease fence;
      (3) the Harness accepted a stale generation 4 after an unfenced new holder, and after a
      Harness restart (its fence was in memory only).
  what_the_fence_did_not_cover_at_65865d00:
    - Only /interaction/step sent lease_generation; /assignments, the watch runner and the
      notebook consumer sent none.
    - The Harness accepted unfenced envelopes, so an unfenced holder never advanced the fence.
    - The Harness kept the newest generation in memory; a restart forgot it.
    - /step never called broker.assert_lease_active and had no deadline, so it could outlive
      its lease.
  what_the_fence_covers_after_unit_g5b:
    gateway_callers: >-
      Every gateway caller of the Browser Harness runs under a HarnessLeaseFence built from
      the task's broker lease (adapters.broker_lease_fence): /interaction/step and
      /assignments (BrowserSessionBroker.lease_for_task_run: the lease the task holds, or one
      taken for the run and released only if still held), the watch runner and the notebook
      consumer. Before every fenced Harness call the fence's guard calls
      broker.assert_lease_active (lease id, holder and generation must match and the lease
      must not have expired) and renews the lease once two thirds of its TTL has elapsed; a
      lapsed or re-taken lease raises BROWSER_HARNESS_LEASE_LOST and nothing is sent. The
      adapter refuses to send a mutating operation (navigate, click, fill, press, scroll,
      upload) without a fence.
    step_deadline: >-
      /interaction/step confirms (and if due renews) its lease before routing and runs the
      router step under asyncio.wait_for with a deadline shorter than the remaining lease
      (at most 30 s, at least a quarter of the remainder, before expiry); past it the step
      is stopped with 504 BROWSER_STEP_DEADLINE_EXCEEDED and its own lease is released.
    harness_worker: >-
      The Harness refuses a mutating operation without lease_generation (428
      LEASE_FENCE_REQUIRED); reads (page_info, describe, screenshot, tabs, wait) may be
      unfenced and are checked when fenced. It persists the newest generation and holder per
      profile under VAN_HARNESS_STATE_ROOT (fsynced before the action runs), so a restart
      does not re-admit a stale generation; unreadable fence state refuses (503
      LEASE_FENCE_STATE_INVALID) rather than resetting.
    owner_interactive_input: >-
      Exempt from the Harness fence because it never passes through the Harness worker: it
      travels the browser stream host / control agent path, fenced by the interactive
      control lease and control generation (InteractiveSessionService.assert_may_actuate).
      The owner preempts automation: an owner session holds the profile lease, which
      advances the generation every automated Harness call is re-checked against.
  limits_after_unit_g5b:
    - The Harness-side refusal knows only generations it has been sent; a holder that never
      calls the Harness (an owner interactive session) is enforced by the gateway guard, not
      by the Harness.
    - The guard and the Harness request are separate steps; a lease cannot be re-taken in
      between while it is live, and the step deadline keeps a /step inside its lease, but
      /assignments has no whole-run deadline (each call is re-checked instead).
    - The in-flight run marker and the step deadline are per gateway process.
    - Stagehand's observe() connection to the Harness-owned Chromium is not fenced (it is
      read-only by policy; blocker_closure_20260929 limit (1) on direct actuation stands).
  wording_corrections:
    - corrects: blocker_closure_20260929.blockers.STAGEHAND-VERIFIER-GAP-20260929.limitation
      note: >-
        The watch runner is verified by BrowserTaskService.verify_read_only_evidence (the
        sealed A1 evidence row read back, verifier READ_ONLY_EVIDENCE_READ_BACK), not by
        WorkflowVerifier. The rest of that limitation stands.
    - corrects: blocker_closure_20260929.blockers.STAGEHAND-DIRECT-ACTUATION-20260929.limitation
      note: >-
        Limit (3) ("the live Harness reports no element list") is superseded by unit G5b: the
        Harness page_info now reports a bounded elements list (and a describe operation for
        one locator), so a targeted Stagehand proposal resolves when the Harness reports that
        exact locator and goes to owner takeover otherwise. Limits (1) and (2) stand.
  blockers_status_unchanged:
    STAGEHAND-VERIFIER-GAP-20260929: CLOSED
    STAGEHAND-DIRECT-ACTUATION-20260929: CLOSED

# =====================================================================================
# APPENDED 2026-09-30 (fifth append) — correction to blocker_closure_correction_20260929
# after independent review I5. Append-only: every byte above this line is preserved
# unchanged. Review I5 found three statements in the fourth append that overstated the
# fence at VAN fbe5502e (findings F1, F2 and the deadline wording). This block records what
# is true after unit G6b's fixes. It does not reopen either blocker (both stay CLOSED; the
# gate model's blocker paths are unchanged) and changes no product, security, money,
# provider or owner-control intent.
# Authority class: OWNER_DERIVED (the owner ordered the review findings closed by the runtime
# work: docs/decisions/OWNER-DECISIONS-20260929-STAGEHAND-PRIVATE-PLANE.md sections 8-10).
# =====================================================================================
fence_correction_review_i5_20260930:
  authority_class: OWNER_DERIVED
  authority_basis:
    owner_record: docs/decisions/OWNER-DECISIONS-20260929-STAGEHAND-PRIVATE-PLANE.md
    owner_record_sha256: 64f1c0560ef88776d0d199392d315767ea3576827e335ba2da8081d12e307c81
    owner_sections: [8, 9, 10]
  signature_claimed: none
  corrects: blocker_closure_correction_20260929
  independent_review:
    id: I5
    reviewed_commit: fbe5502e
    findings: [I5-F1, I5-F2, I5-F3, I5-R1]
    evidence_probe: review-i5/probes/test_i5_fence.py (held outside this repository)
    fixed_by: unit G6b (branch unit-g6b)
    reproduced_at_fbe5502e: >-
      (F1) a /step past its 0.5 s deadline returned 504 and released its lease while its click
      was still at the Harness; task2 took generation 2 and the Harness then applied the
      generation-1 click. (F2) deleting a profile's fence state file and restarting the Harness
      re-admitted stale generation 4 after generation 5. (F3) any local caller could send
      lease_generation 2**62 and lock the real holder out, across restarts.
  statement_corrections:
    - corrects: blocker_closure_correction_20260929.limits_after_unit_g5b[1]
      overstated: the step deadline keeps a /step inside its lease
      at_fbe5502e: >-
        False. The deadline stopped the router waiting, not the Harness call it had sent; the
        lease was then released while that call was still in flight (F1).
      after_unit_g6b: >-
        The deadline stops the router waiting. Every fenced Harness call runs to its end as a
        task the fence tracks, and /step does not release its lease until all of them have
        ended, renewing it while it waits. If a call ended without a response (transport
        failure, timeout), its outcome is unknown and the lease is not released but left to
        expire. The Harness also checks the fence under the same per-profile lock it applies
        the operation under, so no older generation is still applying once a newer one has
        been admitted. Limits: the wait is bounded at 300 s, after which the lease is left to
        expire; and the lease is a gateway-process fact (a gateway that dies mid-call stops
        renewing, and the lease then lapses on its TTL).
    - corrects: blocker_closure_correction_20260929.what_the_fence_covers_after_unit_g5b.harness_worker
      overstated: so a restart does not re-admit a stale generation
      at_fbe5502e: >-
        False when the state file was missing: a missing file read as "never fenced" and the
        fence restarted from nothing (F2). Only an unreadable file refused.
      after_unit_g6b: >-
        The Harness lists every fenced profile in lease-fence-manifest.json beside the state
        files, and bootstrap.sh writes /etc/van-browser-core/harness-fence-installed (with an
        empty manifest) once. A missing state file for a listed profile, or a missing manifest
        while the install marker exists, refuses fenced calls (503 LEASE_FENCE_STATE_MISSING)
        until the state is restored. Limit: a worker without the install marker (not installed
        by bootstrap.sh) that loses its whole state directory, manifest included, starts
        again from first boot.
    - corrects: blocker_closure_correction_20260929.what_the_fence_covers_after_unit_g5b.step_deadline
      overstated: at least a quarter of the remainder
      correct_wording: >-
        The margin before expiry is min(30 s, a quarter of the remaining lease): at most 30 s
        and at most a quarter of the remainder (interaction_router._step_page_lease).
  added_after_unit_g6b:
    fence_authentication: >-
      (F3) The fence was unauthenticated at fbe5502e. The gateway now sends lease_mac =
      HMAC-SHA256 over (alias, generation, holder_id) with a key shared through
      VAN_BROWSER_HARNESS_FENCE_KEY_FILE (gateway) and VAN_HARNESS_FENCE_KEY_FILE (Harness),
      generated by bootstrap.sh and never in the repository. The Harness refuses a fence
      without a valid MAC (403 LEASE_FENCE_MAC_INVALID). A worker with a trust zone configured
      and no usable key refuses every fenced call (503 LEASE_FENCE_KEY_UNCONFIGURED) and will
      not start. Limit: a caller that can read a valid MAC off the loopback can replay that
      same (alias, generation, holder); it cannot advance the fence past the real holder.
  blockers_status_unchanged:
    STAGEHAND-VERIFIER-GAP-20260929: CLOSED
    STAGEHAND-DIRECT-ACTUATION-20260929: CLOSED
