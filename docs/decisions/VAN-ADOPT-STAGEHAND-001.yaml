  production_gate:
    status: PENDING
    meaning: >-
      Stagehand may not be relied on in production until every item in blocking_on is
      resolved. The owner approval above is necessary but not sufficient.
    blocking_on:
      - signed-ingress evidence for the 2026-09-18 approval, or an explicit owner waiver
      - an owner hosting decision for the Stagehand worker (see hosting)
      - live worker/model canary (tools/certification/certify_browser_fabric.py stagehand);
        no van_browser_stagehand_attestation.json is committed
      - the B5 router and the postcondition-verifier gap below
    external_gate_row: >-
      docs/EXTERNAL_GATES.md "Stagehand local semantic browser" = REPO_COMPLETE / PENDING_LIVE;
      REMOTE_BROWSER_IMPLEMENTATION_MATRIX RB-040 (Stagehand live gate) and RB-041 are BLOCKED
      behind RB-002 (owner streaming-host decision).
    not_to_be_confused_with: >-
      backend/van_gateway/automation/health.py governance_state() reports
      production_activation_permitted=true because it only checks that no required decision
      carries a PENDING owner signature. It does not read this production gate.

  hosting:
    where_it_runs_in_code_today:
      worker: deploy/van-trading-core/browser/stagehand_service.mjs (Node >=22.18 <23)
      unit: deploy/van-trading-core/systemd/vati-stagehand.service (User=van-browser,
        Requires=vati-browser-harness.service, EnvironmentFile=/opt/van-trading/config/browser-runtime.env)
      installer: deploy/van-trading-core/browser/bootstrap-browser-runtime.sh (exits 43 on a
        Stagehand version other than 4.1.0)
      bind: 127.0.0.1:9140 loopback only; refuses a non-loopback VAN_STAGEHAND_BIND
      browser: attaches via localBrowser.connect to the Harness-owned Chromium CDP endpoint
        (loopback cdp-endpoint.json); no Browserbase cloud
      gateway_client: backend/van_gateway/browser/adapters.py StagehandAdapter
        (settings.browser_stagehand_base_url default http://127.0.0.1:9140)
      worker_surface: backend/van_gateway/browser/worker.py HybridBrowserWorker under
        backend/van_gateway/browser/subagent.py BrowserSubagentRunner
    observation: >-
      Every deploy artifact for Stagehand lives under deploy/van-trading-core and is
      configured from /opt/van-trading, i.e. it is packaged to co-reside with Trading Core.
      No live deployment evidence exists for any host.
    undecided:
      - which host runs Stagehand + the Harness-owned Chromium in production
      - whether that is the dedicated Browser Stream Host recommended (by delegation, not
        signature) in docs/decisions/VAN-ADOPT-REMOTE-BROWSER-STREAMING-001.yaml, or a
        separate private browser host
      - model provider/model for Stagehand (browser_stagehand_model_provider/_name default
        empty, so StagehandAdapter.configured is false)

  version:
    repo_pin:
      manifest: deploy/van-trading-core/browser/package.json "@browserbasehq/stagehand" = "4.1.0" (exact)
      lockfile: >-
        deploy/van-trading-core/browser/package-lock.json (lockfileVersion 3) resolves
        stagehand-4.1.0.tgz with integrity
        sha512-PJikMBVoaCRh6TFD7GcmeISmsMq4IwUu1BD5FOsGUVDUxrVqZomWa6W6dF+a/zu4xRZu2Z2xX1nXVMDaCuZWsw==
      registry: registries/automation_browser_dependencies.json stagehand.version 4.1.0,
        pin_status UNPINNED_VERIFY_AT_ADOPTION
    observed_upstream_2026_09_29:
