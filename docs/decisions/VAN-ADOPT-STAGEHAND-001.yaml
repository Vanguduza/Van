      local_cdp_runtime_qualification:
        status: PENDING
        requirement: >-
          docs/EXTERNAL_GATES.md "Stagehand local semantic browser" is REPO_COMPLETE /
          PENDING_LIVE; a live observe/extract/act canary under Hermes assignment is required.
      deployment_host_approved:
        status: PENDING
        requirement: >-
          Owner approval of the production host. Current canon (Rev 1.5 §13.1,
          VAN-ADOPT-REMOTE-BROWSER-STREAMING-001) places Stagehand on private Trading Core;
          "Trading Core isolation" is PENDING_LIVE. See
          docs/decisions/VAN-STAGEHAND-PLACEMENT-ASSESSMENT-20260929.md.
