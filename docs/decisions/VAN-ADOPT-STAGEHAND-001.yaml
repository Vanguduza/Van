# Rev 1.3 §§365, 377-379, 418 — Stagehand adoption decision.
# Created 2026-09-18 as an agent proposal; the owner approved it the same day by direct
# session instruction (owner_decision_record). Owner intent is APPROVED. No device-signed,
# replay-protected owner instruction exists for it (signed_ingress: ABSENT). The earlier
# header line, which described this file as an unsigned proposal, was stale proposal-era
# text that contradicted the body; it was reconciled on 2026-09-29 (reconciliation_record)
# without erasing provenance.
decision_id: VAN-ADOPT-STAGEHAND-001
schema_version: 1
subject: Browserbase Stagehand semantic browser layer (local/CDP mode)
blueprint_sections: ["4.2", "365", "377", "378", "379", "418"]

licence: MIT
licence_class: PERMISSIVE
licence_note: Permissive; no owner-signed licence decision is required by stack-lock principle 5.

intended_use:
  - local/CDP mode behind the VAN Browser Gateway
  - semantic observation, typed extraction and bounded interaction
  - never a trading execution or authority surface

mode_boundary:
  default_production_mode: local_cdp
  cloud_browserbase: separate_optional_external_gate_not_requested

technical_boundary:
  executes_live_orders: false
  owner_authority: false
  may_create_van_commands: false
  may_elevate_action_class: false
  semantic_output_trust: UNTRUSTED_EXTERNAL

model_provider_policy:
  # Rev 1.3 §418
  provider_selection: explicitly_configured_only
  credential_locus: gateway
  model_self_selection: forbidden
  page_content_may_change_model: forbidden
  unbounded_model_agent_loop: forbidden
  task_scoped_model_budget_required: true

autonomy_ladder_boundary:
  # Owner decision 2026-09-18 supersedes the L3 cap proposed at Rev 1.2 review M3.
  production_default_max_tier: L5
  model: HERMES_MANAGED_SUBAGENT
  rationale: >-
    The owner directed that browsing "think for itself during assigned tasks but with hermes
    as the main brain or manager so in essence it becomes hermes's subagent". L4/L5 are
    therefore permitted, but only inside a task Hermes assigned, with a goal, scope and step
    budget Hermes set. The worker chooses actions within those bounds and cannot widen them,
    so it stays subordinate rather than becoming an independent VAN agent loop, and the locked
    Hermes execution boundary is preserved.
  subagent_invariants:
    - a task must be assigned by Hermes with an explicit goal, scope and step budget
    - the worker may not create a VAN command, raise an action class, or change its goal
    - the worker may not extend its own step budget, deadline or domain scope
    - every step is attributed to the assigning Hermes turn
    - exhausting the budget ends the task; it never escalates
    - A3 mutation inside an autonomous task still requires an admitted domain and profile
    - A4 remains outside the ladder entirely and needs a fresh owner biometric approval
    - payments are never performed by an autonomous browser task

observed_runtime:
  design_time_observation: "4.1.0"
  deployment_branch_pin: "4.1.0"
  # Label shared with registries/automation_browser_dependencies.json and stack_lock.json;
  # it tracks adoption qualification, which is pending. The version and npm integrity
  # digest themselves are exact (see version_pin_assessment).
  pin_status: UNPINNED_VERIFY_AT_ADOPTION

version_pin_assessment:
  assessed_on: 2026-09-29
  repo_pin:
    package_json: 'deploy/van-trading-core/browser/package.json pins @browserbasehq/stagehand to exactly 4.1.0 (no range)'
    lockfile: deploy/van-trading-core/browser/package-lock.json (lockfileVersion 3, 46 entries, all with integrity)
    lockfile_integrity: sha512-PJikMBVoaCRh6TFD7GcmeISmsMq4IwUu1BD5FOsGUVDUxrVqZomWa6W6dF+a/zu4xRZu2Z2xX1nXVMDaCuZWsw==
    install_path: bootstrap-browser-runtime.sh runs `npm ci` and exits 43 unless the installed version is 4.1.0
    floating_ranges_for_stagehand: none (the transitive @browserbasehq/sdk ^2.16.0 is resolved by the lock to 2.20.0 with integrity)
  upstream_observed_2026_09_29:
    repository: browserbase/stagehand
    head: ad2bf12ea7abd95bb1d6f3a59600842a0954fffb
    latest_release_tag: "@browserbasehq/stagehand@4.1.0"
    tag_object: 308bd2b0def8807ab7afa75bc62a1612db3c143c
    tag_commit: cd7b230778cf92269e4cb90e80d97f5113781c51
    npm_dist_tags: {latest: 4.1.0, alpha: 4.2.0-alpha-ad2bf12ea7abd95bb1d6f3a59600842a0954fffb}
    npm_integrity_4_1_0: matches repo lockfile_integrity byte-for-byte
    npm_gitHead: absent (the npm tarball does not itself bind to a source commit)
    licence: MIT
  gap:
    - the tarball-to-source-commit binding (tag commit cd7b2307) is an observation, not qualification evidence
    - no SBOM / transitive-dependency qualification record for the 46 locked packages
    - pin_status label remains UNPINNED_VERIFY_AT_ADOPTION until qualification relabels it in all three files together

# Decision-record vocabulary: SIGNED here means an owner decision recorded through the
# Project Truth process (PROJECT_TRUTH_PROTOCOL tier 2; PROJECT_CANONICAL_STATE.json
# owner_instruction_is_project_truth_authority). It is NOT a tier-1 device-authenticated,
# replay-protected owner-signed instruction. The literal is kept because stack-lock admission
# (tests/contracts/test_automation_browser_governance.py, trading/tests/
# test_automation_browser_stack_proposal.py, tools/architecture/promote_stack_lock_layers.py)
# keys on it; owner_signature_semantics and signed_ingress make its meaning explicit.
owner_intent_status: APPROVED
owner_signature_status: SIGNED
owner_signature_semantics:
  basis: PROJECT_TRUTH_OWNER_INSTRUCTION
  authority_tier: "PROJECT_TRUTH_PROTOCOL tier 2 (Project Truth), not tier 1 (device-signed)"
  device_signed: false
owner_signed_at: 2026-09-18
owner_signature_evidence_ref: evidence://owner/session/01JhzRtSJ6z18Vcx8Eo2yYB5#automation-browser-fabric-approval

signed_ingress:
  status: ABSENT
  evidence_ref: null
  note: >-
    No device-signed gateway-ingress record of this decision exists. None is claimed or
    fabricated. owner_decision_record.provenance says production "should additionally capture
    the owner-signed record through signed ingress"; that is tracked as a production gate
    component below.

owner_decision_record:
  decided_on: 2026-09-18
  decision: APPROVED_AS_HERMES_SUBAGENT
  owner_words: >-
    "Web browsing should think for itself during assigned tasks but with hermes as the main
    brain or manager so in essence it becomes hermes's subagent."
  provenance: >-
    Owner instruction given directly in the implementation session; Project Truth authority
    under PROJECT_CANONICAL_STATE.json. Not a device-signed gateway command; a production
    deployment should additionally capture the owner-signed record through signed ingress.

reconciliation_record:
  reconciled_on: 2026-09-29
  authority: >-
    Owner instruction in Claude Code session session_01CSuhPskbCd3shvSXX1P7JT
    (auth-20260929-owner-jev-openmuse-convergence-r1; docs/project-state/
    MISSION_PROVENANCE_MEMORY_FABRIC_JEV_20260929.md). The owner preserved the 2026-09-18
    intent and asked for this reconciliation. It did not newly sign anything.
  corrected:
    - "header line 1 said 'NOT owner-signed' while the body recorded SIGNED/APPROVED_AS_HERMES_SUBAGENT"
    - "SIGNED carried no statement of its basis, so it could be read as a device-signed claim"
  preserved_unchanged:
    - owner_decision_record (date, decision, owner words, provenance)
    - owner_signature_evidence_ref
    - autonomy_ladder_boundary and every technical boundary

production_gates:
  STAGEHAND_PRODUCTION_ADOPTION_RECONCILED:
    status: PENDING
    components:
      owner_intent_preserved:
        status: SATISFIED
        evidence:
          - owner_decision_record (APPROVED_AS_HERMES_SUBAGENT, 2026-09-18)
          - evidence://owner/session/01JhzRtSJ6z18Vcx8Eo2yYB5#automation-browser-fabric-approval
      contradictory_metadata_corrected:
        status: SATISFIED
        evidence:
          - reconciliation_record (2026-09-29)
          - tests/contracts/test_automation_browser_governance.py::test_decision_record_signature_status_is_coherent
      production_signed_ingress_evidence:
        status: PENDING
        requirement: >-
          Recommended by this record's own provenance ("should"); not mandated by
          docs/SECURITY_POLICY.md for a non-trading browser worker. Held as blocking here
          (fail closed) until the owner either supplies the signed-ingress record or
