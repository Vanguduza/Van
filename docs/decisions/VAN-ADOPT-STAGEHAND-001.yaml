      npm_4_1_0_integrity_matches_lockfile: true
      release_tag: "@browserbasehq/stagehand@4.1.0 -> commit cd7b230778cf92269e4cb90e80d97f5113781c51"
      default_branch_head: ad2bf12ea7abd95bb1d6f3a59600842a0954fffb
      head_is_release: false
      head_note: >-
        HEAD ad2bf12e is an unreleased commit ahead of the 4.1.0 tag; npm publishes it only as
        4.2.0-alpha-ad2bf12e... The blueprint's "ad2bf12e (@browserbasehq/stagehand@4.1.0)" and
        the mission provenance table pair HEAD with the latest tag; they are not the same code.
    reading: >-
      The repo pins the released 4.1.0 exactly and its lockfile integrity matches the npm
      registry. It does not pin, and must not be read as pinning, upstream HEAD. pin_status
      remains UNPINNED_VERIFY_AT_ADOPTION until a live runtime reports 4.1.0 through the
      gateway health check. No dependency was changed by this reconciliation.

  programme_b_router_position:
    contract: B5 (blueprint section 3)
    order:
      - deterministic typed Playwright/CDP (Browser Harness)
      - dial-jev PROPOSE_ACTION, only when B2 classify_observation is eligible
      - Stagehand semantic fallback (this decision)
      - owner takeover / policy refusal
    invariants:
      - Jev proposes only; Jev never executes a browser action and holds no Chromium,
        browser session, router or credential plane (B0/B1)
      - Stagehand is reached only after the deterministic lane and the Jev lane have
        abstained, been ineligible or failed; default router eligibility denies everything
      - Stagehand output is UNTRUSTED_EXTERNAL and may not raise the action class
      - a Stagehand result counts as success only after the same independent postcondition
        verifier used for every other lane returns VERIFIED_SUCCESS; Stagehand cannot
        certify its own effect
      - Stagehand is not a Jev dependency
    implementation_state: >-
      The B5 router is Subagent G's deliverable and does not exist in VAN on this branch
      (no Jev/PROPOSE_ACTION reference under backend/van_gateway/browser or capability).
      This section records the required position; it is not evidence that it is wired.
    gap_found:
      id: STAGEHAND-VERIFIER-GAP-20260929
      finding: >-
        In HybridBrowserWorker.propose, a Stagehand observe() that returns no controls yields
        ProposedAction(done=True); BrowserSubagentRunner stops with GOAL_ACHIEVED and
        browser/api.py marks the task COMPLETED with succeeded=true. No independent
        postcondition verifier (backend/van_gateway/automation/verifier.py is used only by
        the automation dispatch/production paths) runs on the browser subagent path, so
        Stagehand's "nothing left to do" is currently accepted as success.
      also: >-
        Stagehand act() replays the observed action itself over CDP on the shared Chromium;
        the Harness only reads the page back afterwards. The B5 target says the Harness /
        Browser Control Agent executes.
      disposition: open; to be closed by the B5 router work, not by this record

  owner_decisions_required:
    # Open questions only. None of these is decided by this record.
    - id: OQ-STAGEHAND-HOST
      question: >-
        Where does the production Stagehand worker (with the Harness-owned Chromium) run?
      recommendation: >-
        A private browser host, not the trading host. Current packaging co-resides with
        Trading Core; VAN-ADOPT-REMOTE-BROWSER-STREAMING-001 already rejects co-residing
        Chromium with Trading Core for the streaming path.
    - id: OQ-STAGEHAND-SIGNED-INGRESS
      question: >-
