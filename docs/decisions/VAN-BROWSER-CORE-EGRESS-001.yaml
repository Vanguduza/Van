# Unit G12 — production gate: the van-browser-core egress proxy and zone firewall must be
# qualified on the provisioned host. NOT owner-signed; holds no new decision.
#
# It records, in the form the production gate model reads (registries/
# production_activation_gates.json, capability_decisions), what the owner answered on
# 2026-09-30 after independent review I7 (answers quoted below verbatim, as selected in Claude
# Code session session_01ELKqm4GCPmPvF3ggKkgB1J; no device or cryptographic signature is
# claimed; the Project Truth authorization record for this change is written by the
# integrator, not by this unit).
#
# The gate `egress_qualification` is a `qualify_report` gate: its status word alone never makes
# it GREEN. GREEN needs `egress_qualification.status: QUALIFIED` *and* a qualify.sh report file
# under evidence/van-browser-core/qualify/ named at `qualify_report`, whose sha256 is pinned at
# `qualify_report_sha256`, for zone van-browser-core, in which every check in the model's
# required_checks is present, required and GREEN. A RED required check is BLOCKED. Until the
# report from the provisioned host exists this stays PENDING, and with it the browser_harness,
# stagehand and jev_browser_effect capabilities (backend/van_gateway/automation/
# production_gates.py CAPABILITY_DECISIONS) are not production-permitted.
decision_id: VAN-BROWSER-CORE-EGRESS-001
schema_version: 1
subject: van-browser-core egress proxy and zone firewall (review I7 WebSocket, UDP and post-window egress)
owner_signature_status: NOT_APPLICABLE_RECORDS_OWNER_ANSWERS
recorded_by: unit G12
recorded_at: "2026-09-30"

owner_answers_20260930_review_i7:
  channel: owner answers in Claude Code session session_01ELKqm4GCPmPvF3ggKkgB1J, 2026-09-30, after independent review I7; no device or cryptographic signature claimed
  websocket:
    question: "WebSocket connections can't be blocked by the browser guard. It detects them and closes the page, but the handshake still reaches the server. A handshake URL can carry a payment request (e.g. /ws-pay?amount=500). What should happen?"
    selected_label: "Egress proxy (Recommended)"
    selected_text: "Route the van-browser-core browser through a local egress proxy that refuses WebSocket upgrades and non-GET requests unless the task is admitted as mutating. That is repository and zone work, and it also covers UDP. Stagehand stays production-disabled until it exists."
  udp:
    question: "The guard only covers requests made over HTTP. WebRTC and WebTransport (UDP) traffic from the browser isn't seen at all, and Chrome flags don't stop it. How should that be handled?"
    selected_label: "Firewall UDP in zone (Recommended)"
    selected_text: "Add a host firewall rule in the van-browser-core deploy that drops all UDP from the browser user except DNS to the resolver. Applied at provisioning and checked by qualify.sh."

implementation:
  proxy: deploy/van-browser-core/browser/egress_proxy.py (van-browser-egress.service)
  firewall: deploy/van-browser-core/firewall/van-browser-core.nft (van-browser-core-firewall.service)
  chromium_flags: deploy/van-browser-core/browser/harness_service.py egress_proxy_flags()
  qualification: deploy/van-browser-core/qualify.sh (section 6)
  design_record: docs/project-state/VAN_BROWSER_CORE_MIGRATION_20260929.md (Egress proxy and zone firewall)

egress_qualification:
  # PENDING: nothing has run on a provisioned van-browser-core host. The repository sandbox
  # ran the proxy with real Chromium and the ruleset in a network namespace; that is not host
  # qualification. Set QUALIFIED only together with the host's qualify.sh report below.
  status: PENDING
  qualify_report: null
  qualify_report_sha256: null
