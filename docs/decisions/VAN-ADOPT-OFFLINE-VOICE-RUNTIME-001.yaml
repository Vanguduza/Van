# Rev 1.5 §0E.2 / §32.5 — the offline voice runtime, and the earlier decision it supersedes.
#
# §0E.2 requires this artefact to exist before any component in the wake/ASR/TTS group may
# change maturity state. It records a reversal; it does not perform one.
decision_id: VAN-ADOPT-OFFLINE-VOICE-RUNTIME-001
schema_version: 1
subject: hardened offline voice edge — local wake, local ASR fallback, local TTS
blueprint_sections: ["0B", "0E.2", "21", "32.5", "35 Track C"]

decision_type: OWNER_SUPERSESSION
supersedes:
  record: docs/VAN_CONSOLIDATED_DEPLOYMENT_READINESS_CLOSURE_BLUEPRINT_REV_1.md
  section: "29. Owner decisions, and the default taken where none was given"
  item: "2 | Sherpa ASR | Do not build it."
  prior_reasoning: >-
    Raising minSdk to 31 removed the only path that required Sherpa, so the backend enum
    stayed fail-closed for a future re-lowering. That reasoning was correct for the question
    it answered: recognition on devices with no on-device recognizer API.
  why_it_no_longer_settles_the_question: >-
    The later requirement is not about old API levels. It is that VAN must hear and speak
    when there is no public internet path at all (§0B, ADR-RB-014, ADR-RB-016), which the
    platform recognizer does not guarantee and a cloud voice service cannot provide by
    definition. Same component, different question.
  reversal_path_named_by_the_prior_decision: >-
    Add the dependency, the model asset, and a build guard asserting both.

basis: >-
  owner instruction requiring hardened offline voice input and local talk-back

provenance:
  given_on: 2026-09-19
  form: >-
    The owner supplied docs/VAN_REMOTE_BROWSER_PRODUCTION_BLUEPRINT_REV_1_5.md, which carries
    the requirement in §0B and §0E.2, and instructed that the document be implemented to
    completion with the agent's recommendations where owner decisions are needed.
  honest_limit: >-
    The owner did not restate the offline-voice requirement in their own words in this
    session. The provenance is the document they supplied plus the instruction to implement
    it. That is recorded here rather than paraphrased into a quotation they did not give.

# ---------------------------------------------------------------- what this admits

admits:
  runtime: sherpa-onnx (Android)
  licence: Apache-2.0
  registry_entry: registries/remote_browser_dependencies.json#offline_voice.sherpa_onnx
  capabilities_in_scope:
    - local wake-word detection
    - local wake-phrase verification
    - local voice activity detection
    - local ASR fallback when no Hermes path exists
    - local text-to-speech for spoken answers and critical status phrases

does_not_admit:
  - any cloud ASR fallback; the prior blueprint's "Do not add cloud fallback" still holds
  - any change to a component's maturity state before a real model and native library exist
  - lowering minSdk; owner decision 1 is untouched and is a separate question

# ---------------------------------------------------------------- what is still absent

state_at_this_decision:
  sherpa_native_library: ABSENT
  wake_model: ABSENT
  tts_voice_model: ABSENT
  asr_model: ABSENT
  consequence: >-
    WakeWordEngine, WakePhraseVerifier, SpeakerSimilarityScorer and LocalSecondPassAsr remain
    EXTERNALLY_BLOCKED_REPOSITORY_COMPLETE. This decision changes what VAN is permitted to
    adopt; it does not put a model in the repository, and §32.8 forbids moving the ledger on
    the strength of an adapter existing.
  what_would_change_them: >-
    A signed voice asset pack whose digests WakeModelAsset verifies, a pinned sherpa-onnx
    release with its digest recorded in the registry, and a device run in which VAN hears a
    wake word and speaks an answer with no network path.

owner_action_required:
  - supply or approve the voice model bundle and its licence terms
  - the repository builds the loader, the manifest, the fail-closed readiness classification
    and the routing; it cannot author a model

unchanged_by_this_decision:
  - fail-closed readiness, so an absent or digest-mismatched model reports UNAVAILABLE with a reason
  - VAN never invents a transcript or a spoken answer it did not synthesise
  - speaker verification remains a separate gate from recognition
