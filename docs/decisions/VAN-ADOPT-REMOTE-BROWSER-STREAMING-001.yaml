# Rev 1.5 §§13, 25, 32 — Remote Browser streaming topology and Android dependency admission.
#
# This record exists because §25.1 requires an explicit owner decision on the production
# host before implementation, and §32 requires named, digest-verified dependencies before
# Android transport code is written.
decision_id: VAN-ADOPT-REMOTE-BROWSER-STREAMING-001
schema_version: 1
subject: dedicated Browser Stream Host topology, and the Android WebRTC/HTTP dependencies
blueprint_sections: ["0A", "0E", "13", "25", "32", "35"]

decision_type: OWNER_DELEGATED_RECOMMENDATION
owner_signature_status: DELEGATED_NOT_COUNTERSIGNED
owner_delegation:
  given_on: 2026-09-19
  owner_words: >-
    "Fix descripances and fully implement to completion without stopping that document
    using you best recommendations where owner decisions are needed"
  meaning: >-
    The owner delegated the Phase 0 architectural choices to the implementation agent and
    asked for recommendations rather than questions. This record therefore carries the
    agent's recommendation as the operative decision. It is not a forged owner signature:
    where the decision needs the owner to spend money, provision hardware or hold a device,
    that part is recorded as an action the owner still has to take.

# ---------------------------------------------------------------- topology

topology_decision:
  chosen: DEDICATED_DUAL_HOMED_BROWSER_STREAM_HOST
  rejected:
    - option: expose van-trading-core publicly
      because: >-
        §0A/B1 and §42.6 both forbid it. Trading Core holds VATI, browser profiles, domain
        policy and the Browser Fabric authority. Putting a public media listener on the same
        host puts an encoder's CPU starvation and an internet-facing attack surface next to
        the system that authorises trades.
    - option: run Chromium and the encoder on Trading Core behind a tunnel
      because: >-
        It solves reachability and nothing else. 2 OCPU ARM64 cannot hold 1080p60 encode and
        Chromium render while remaining an authority peer (§0A/B2), and a tunnel does not
        make the media path any less co-resident.
    - option: defer the host until after a first frame is proven locally
      because: >-
        §25.5 explicitly moved that promotion gate to Phase 0. Proving a first frame against
        the wrong host shape produces a latency number nobody can act on.
  shape_requirements:
    - public interface for signalling, ICE, WebRTC media and TURN where needed
    - private VCN interface carrying only the Browser Control Agent mTLS RPC
    - Chromium, CDP, compositor, capture and encoder bound to loopback or local only
    - no public CDP, ever, on any interface
    - headroom for one production session below sustained 80% system CPU (§25.3)
  sizing:
    status: DEFERRED_TO_MEASUREMENT
    rationale: >-
      §25.3 says the shape is selected from measured Phase 1 evidence. Naming an OCI shape
      here would be a guess presented as a specification.
  owner_action_required:
    - provision the host and its VCN attachment
    - decide whether TURN is co-resident or separate once measured
    - the repository cannot do either, and no code in this programme assumes they exist

# ---------------------------------------------------------------- dependencies

android_dependency_admission:
  registry: registries/remote_browser_dependencies.json
  webrtc:
    coordinate: io.github.webrtc-sdk:android:150.7871.01
    artifact_sha256: 0a1627b1a48c2bc17d9a40d62fc47bd45166f44a311e95917f147c402de379b0
    licence: BSD-3-Clause
    digest_provenance: >-
      Downloaded from repo1.maven.org during this decision and hashed locally. The digest is
      a measurement, not a quotation.
    admitted_for: >-
      the interactive media client only. It does not become the app's general network stack
      and does not replace any existing Gateway transport.
    outstanding:
      - upstream WebRTC/Chromium source revision unresolved (§32.1) and recorded as such
      - decode/DataChannel canary and H.264 MediaCodec confirmation are S24 device gates
  okhttp:
    coordinate: com.squareup.okhttp3:okhttp:4.12.0
    artifact_sha256: b1050081b14bb7a3a7e55a4d3ef01b5dcfabc453b4573a4fc019767191d5f4e0
    licence: Apache-2.0
    deviation_from_blueprint: >-
      §32.2 proposes okhttp 5.5.0. That artefact depends on kotlin-stdlib 2.1.21 and carries
      Kotlin 2.1 metadata, and this project compiles with the Kotlin 1.9.24 plugin, so the
      build would fail the first time the dependency was read. 4.12.0 is the current release
      of the line that pairs with Kotlin 1.9 (okio 3.6.0, kotlin-stdlib-jdk8 1.8.21).
      §32.2's own instruction is that the exact admitted version is locked after Gradle and
      Android compatibility verification; this is that verification producing a different
      answer from the document's candidate.
    revisit_when: the project adopts a Kotlin 2.x toolchain under its own decision
  existing_stack_unchanged: >-
    HttpURLConnection remains the ordinary Gateway transport (§32.2). This admission does not
    authorise a network-stack rewrite.

# ---------------------------------------------------------------- boundaries

technical_boundary:
  media_host_holds_owner_authority: false
  media_host_may_mint_authority: false
  public_cdp: forbidden
  stagehand_or_harness_on_stream_host: forbidden
  raw_profile_or_cookie_export_across_hosts: forbidden

unchanged_by_this_decision:
  - Stagehand and Browser Harness stay on private Trading Core (§13.1)
  - config/browser/profiles.yaml remains the profile authority
  - the Gateway remains the only issuer of stream grants and leases
  - nothing here makes any component INTEGRATED_AND_EVIDENCED; the host does not exist
