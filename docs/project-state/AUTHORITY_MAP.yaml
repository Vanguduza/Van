# P3-DOC-005 — which document owns which invariant.
#
# Thirty-one canonical documents, around 13,700 lines. Nothing said which one is
# authoritative for a given rule, so two could each be locally correct and jointly
# contradictory, and a reader had no way to know which to believe. That is not a
# documentation tidiness problem: the audit's own findings include cases where a document
# described a capability as BUILT while another described the gap, and both survived
# because neither owned the claim.
#
# A machine cannot detect a contradiction between two prose documents. What it can detect
# is two documents both claiming authority over the same subject, which is the condition
# that lets a contradiction persist. So every invariant here names:
#
#   subject         a dotted path. Exactly one document owns each subject; a second claim
#                   on the same subject is a CI failure.
#   owner           the document that decides this. Its word is final, and any other
#                   document describing it is a restatement that may be wrong.
#   statement       the invariant in one sentence, in the present tense, falsifiable.
#   implemented_by  where the rule is enforced in code, not where it is mentioned.
#   tested_by       the test that fails if the rule stops holding.
#   findings        the audit findings that established or restored it.
#
# The rule for adding an entry is the rule the whole closure pass runs on: an invariant
# with no test is a claim, and this file does not hold claims. tools/ci/authority_map.py
# refuses an entry whose owner, implementation or test does not exist, refuses a subject
# owned twice, and refuses a finding id the register does not contain.
#
# docs/SECURITY_POLICY.md is pinned by SHA-256 and is not edited by this programme. It
# appears here as an owner, which is a statement about where authority lives, not a change
# to it.

version: 1
generated_for: "VAN Consolidated Deployment-Readiness Closure Blueprint Rev 2"

# The documents permitted to own an invariant, declared rather than inferred from whatever
# happens to appear below. Without this, "the owner is a file under docs/" is the whole
