# The direct mutual-TLS link from the app to the VAN gateway on the Hermes host (dial-control).
# Every build reads this, debug and release, unless VAN_GATEWAY_BASE_URL is supplied as a
# Gradle property or environment variable. An override replaces the address *and* the CA
# together: the CA below is pinned for this address only.
#
# Both values are public. The CA certificate is the trust anchor the app pins; its private
# key never leaves ~/.local/share/van/mtls on the host. Issued 2026-09-25 by
# tools/runtime/enable_van_mtls.sh; valid until 2036-09-22.
# CA sha256 fingerprint:
#   CE:B5:51:D3:59:B8:B5:42:4F:2A:E1:91:85:83:AF:FB:F0:A6:06:D4:4C:16:B2:3D:FA:85:29:86:80:21:30:6C
#
# If the host's CA is ever re-created, every phone must be rebuilt with the new value here.
VAN_GATEWAY_BASE_URL=https://62.83.35.103:8443
VAN_GATEWAY_CA_PEM_
