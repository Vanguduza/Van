name: canonical-main-prune-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/canonical-main-prune-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches proven obsolete or reconciled
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          declare -A expected=(
            ["build/canonical-owner-debug-20260918"]="f2e084bab05f2ee8daaccdc5bf7a2c5f573ef5c9"
            ["build/s24-direct-hermes-20260919"]="813fad4ed2b789e32cfdd071b6f2a3b39741851d"
            ["build/test-apk-20260918"]="a6e5e33e3fa8b35858d78fa025e8fb5dfc3f32db"
            ["claude/van-trading-intelligence-blueprint-7egebl"]="3a88ac0c0fca3c701712ea38a092cd42c5ef97a0"
            ["diag/android-installability-20260918"]="7705f8db72ee4b0bc84afa658e0aa3eb6d68ab9d"
            ["fix/debug-loopback-pairing-20260919"]="a4448dda594943fcdd68c03fb0c8bf3bcbab4eb0"
            ["fix/s24-preconfigured-owner-build-20260919"]="f50e521092939208fda2ff8d265b7a076a5c8807"
            ["fix/s24-test-apk-icon"]="f79c862cdd8ac0d0f9714142d8f4048f41e2207a"
            ["gpt/van-unified-intelligence-improvements-rev1-20260918"]="e09765d70d6a6a3172141a3dc9710362d2554d26"
          )

          for branch in "${!expected[@]}"; do
            ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "${ref}"; then
              echo "ALREADY_GONE ${branch}"
              continue
            fi
            actual="$(git rev-parse "${ref}")"
            if [ "${actual}" != "${expected[${branch}]}" ]; then
              echo "REFUSE_MOVED ${branch}: expected ${expected[${branch}]}, found ${actual}"
              exit 1
            fi
          done

          for branch in "${!expected[@]}"; do
            if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              echo "DELETE ${branch}"
              git push origin --delete "${branch}"
            fi
          done

      - name: Verify only main plus explicitly retained work remains
        shell: bash
        run: |
          set -euo pipefail
          remote_heads="$(git ls-remote --heads origin)"
          for branch in             "build/canonical-owner-debug-20260918"             "build/s24-direct-hermes-20260919"             "build/test-apk-20260918"             "claude/van-trading-intelligence-blueprint-7egebl"             "diag/android-installability-20260918"             "fix/debug-loopback-pairing-20260919"             "fix/s24-preconfigured-owner-build-20260919"             "fix/s24-test-apk-icon"             "gpt/van-unified-intelligence-improvements-rev1-20260918"
          do
            if grep -Fq "refs/heads/${branch}" <<<"${remote_heads}"; then
              echo "STILL_PRESENT ${branch}"
              exit 1
            fi
          done
          echo "Obsolete/reconciled branches pruned."
