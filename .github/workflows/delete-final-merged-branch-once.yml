name: delete-final-merged-branch-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-final-merged-branch-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged Trading Commander branch
        shell: bash
        run: |
          set -euo pipefail
          branch="gpt/hermes-full-trading-commander-20260921"
          expected="eba8b78ba03ed4e15fc15c9aad4db684128f4054"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            echo "ALREADY_GONE ${branch}"
            exit 0
          fi
          actual="$(git rev-parse "origin/${branch}")"
          if [ "${actual}" != "${expected}" ]; then
            echo "REFUSE_MOVED ${branch}: expected ${expected}, found ${actual}"
            exit 1
          fi
          git push origin --delete "${branch}"
          if git ls-remote --exit-code --heads origin "${branch}"; then
            echo "Branch still exists"
            exit 1
          fi
          echo "Final merged branch deleted."
