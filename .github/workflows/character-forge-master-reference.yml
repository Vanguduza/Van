name: Character Forge exact master reference

on:
  push:
    branches:
      - gpt/van-character-forge-production-v3-20260924
    paths:
      - .github/workflows/character-forge-master-reference.yml
      - tools/character_forge/build_master_reference.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/van-character-forge-production-v3-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned raster dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
      - name: Build exact derived 2x reference
        run: |
          python tools/character_forge/build_master_reference.py \
            --source visual-authority/assets/pack/owner_board_visual_authority.png \
            --output visual-authority/character-forge/01-master-candidates/van_canonical_reference_2x.png \
            --receipt visual-authority/character-forge/01-master-candidates/van_canonical_reference_2x.receipt.json \
            --scale 2
      - name: Commit generated reference and receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-authority/character-forge/01-master-candidates/van_canonical_reference_2x.png \
                  visual-authority/character-forge/01-master-candidates/van_canonical_reference_2x.receipt.json
          if git diff --cached --quiet; then
            echo "reference already current"
            exit 0
          fi
          git commit -m "character-forge v3: materialize exact 2x canonical master reference"
          git push origin HEAD:gpt/van-character-forge-production-v3-20260924
