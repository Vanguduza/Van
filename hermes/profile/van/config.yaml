# Hermes profile metadata — VAN
# Profile name MUST remain exactly "van"

profile: van
display_name: VAN
product: DIAL owner assistant
pack_version_file: ../../VERSION

owner: single-owner

# Primary VAN reasoning/runtime model. Authentication is resolved by Hermes
# from the owner's existing Claude Code/Anthropic credential store.
model:
  provider: anthropic
  default: claude-sonnet-5

execution:
  runtime: hermes
  secondary_agent_allowed: false

authority:
  truth_protocol: docs/PROJECT_TRUTH_PROTOCOL.md
  security_policy: docs/SECURITY_POLICY.md
  visual_contract: visual-authority/rive_contract.json
  project_registry: registries/projects.json
  google_capability_registry: registries/google_capabilities.json
  google_architecture: docs/GOOGLE_INTELLIGENCE_MESH.md
  trading_architecture: docs/VAN_ADAPTIVE_TRADING_INTELLIGENCE_TECHNICAL_BLUEPRINT_REV2.md
  trading_architecture_rev3: docs/VAN_ADAPTIVE_TRADING_INTELLIGENCE_TECHNICAL_BLUEPRINT_REV3.md
  trading_architecture_consolidated: docs/VAN_TRADING_SYSTEM_BLUEPRINT_REV4_CONSOLIDATED.md
  trading_research_corpus: docs/research/VATI_REV3_RESEARCH_CORPUS.md
  trading_deployment: docs/VAN_TRADING_PRODUCTION_DEPLOYMENT_BLUEPRINT_REV5.md

policy:
  hook_module: policy/van_policy_hook.py
  hook_entrypoint: evaluate
  enforce_action_classes: true
  deny_a5: true
  require_approval_a4: true
  protect_audit_truth: true
  protect_google_identity_broker: true
  protect_trading_risk_authority: true
  deny_model_broker_orders: true

skills:
  root: skills
  names:
    - owner-briefing
    - google-workspace
    - google-intelligence
    - gemini-notebook
    - google-design
    - google-development
    - project-steering
    - research
    - decision-support
    - document-work
    - notification-triage
    - infrastructure-diagnostics
    - hermes-administration
    - trading-intelligence

bot:
  chat_spec: bot/BOT_CHAT.md
  message_agent_spec: bot/message_agent.md
  councils_spec: bot/councils.md
  native_rooms_required_for_councils: true
  fail_closed_fallback: direct_bot_messaging

# Google capabilities are specialist tools beneath Hermes. They use Gemini
# where a Google AI runtime is needed, but do not replace Sonnet 5 as VAN's
# primary reasoning/orchestration model.
google_runtime:
  provider: gemini
  identity_root: owner_google_account
  credential_plane: gemini_runtime
  account_owned_runtime_required: true
  prefer_gemini_for_google_ai: true
  primary_hermes_model_override_allowed: false
  workspace_oauth_reuse_for_gemini: false
  consumer_account_session_for_google_apps: true
  credential_env_names:
    - GOOGLE_API_KEY
    - GEMINI_API_KEY
  credential_planes:
    - workspace_oauth
    - gemini_runtime
    - cloud_service
    - consumer_session
  oauth_in_prompts: false
  consumer_cookie_export_allowed: false
  spec: providers/gemini.md

mcp:
  readme: mcp/README.md

# Subordinate MCP servers Hermes may spawn. The trading commander is a typed
# command surface on van-trading-core (never a shell); the block is spliced into
# ~/.hermes/config.yaml by deploy/van-trading-core/hermes/register-commander-mcp.sh.
mcp_servers:
  van_trading_commander:
    command: node
    args: ["trading/commander/mcp_stdio.mjs"]
    cwd: "<van-repo-root>"
    env:
      VAN_COMMANDER_URL: "https://10.0.1.233:9133"
      VAN_COMMANDER_TOKEN_FILE: "~/.van/commander.token"
    enabled: true
    connect_timeout: 20
    timeout: 120
    supports_parallel_tool_calls: false
    tools:
      include: [status, ledger_status, services, restart_service, tail_log, run_backtest, vekl_resolve, halt, doctor, accounts]
      resources: false
      prompts: false
    authority: SUBORDINATE_CAPABILITY_NOT_AUTHORITY

registered_projects:
  - van
  - dial
  - dde
  - gtr
  - goat
  - aeci
