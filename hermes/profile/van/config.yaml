# Hermes profile metadata — VAN
# Profile name MUST remain exactly "van"

profile: van
display_name: VAN
product: DIAL owner assistant
pack_version_file: ../../VERSION

owner: single-owner

# Primary VAN reasoning/runtime model. Authentication is resolved by Hermes
# from the owner's existing Claude Code/Anthropic credential store.
model:
  provider: anthropic
  default: claude-sonnet-5

execution:
  runtime: hermes
  secondary_agent_allowed: false

authority:
  truth_protocol: docs/PROJECT_TRUTH_PROTOCOL.md
  security_policy: docs/SECURITY_POLICY.md
  visual_contract: visual-authority/rive_contract.json
  project_registry: registries/projects.json
  google_capability_registry: registries/google_capabilities.json
  google_architecture: docs/GOOGLE_INTELLIGENCE_MESH.md

policy:
  hook_module: policy/van_policy_hook.py
  hook_entrypoint: evaluate
  enforce_action_classes: true
  deny_a5: true
  require_approval_a4: true
  protect_audit_truth: true
  protect_google_identity_broker: true

skills:
  root: skills
  names:
    - owner-briefing
    - google-workspace
    - google-intelligence
    - gemini-notebook
    - google-design
    - google-development
    - project-steering
    - research
    - decision-support
    - document-work
    - notification-triage
    - infrastructure-diagnostics
    - hermes-administration

bot:
  chat_spec: bot/BOT_CHAT.md
  message_agent_spec: bot/message_agent.md
  councils_spec: bot/councils.md
  native_rooms_required_for_councils: true
  fail_closed_fallback: direct_bot_messaging

# Google capabilities are specialist tools beneath Hermes. They use Gemini
# where a Google AI runtime is needed, but do not replace Sonnet 5 as VAN's
# primary reasoning/orchestration model.
google_runtime:
  provider: gemini
  identity_root: owner_google_account
  delegated_identities:
    antigravity:
      identity_alias: antigravity_worker_account
      isolated_runtime_home: true
      credential_inheritance_allowed: false
      owner_authority: false
      workspace_access: false
      project_truth_authority: false
  credential_plane: gemini_runtime
  account_owned_runtime_required: true
  prefer_gemini_for_google_ai: true
  primary_hermes_model_override_allowed: false
  workspace_oauth_reuse_for_gemini: false
  consumer_account_session_for_google_apps: true
  credential_env_names:
    - GOOGLE_API_KEY
    - GEMINI_API_KEY
  credential_planes:
    - workspace_oauth
    - gemini_runtime
    - cloud_service
    - consumer_session
  oauth_in_prompts: false
  consumer_cookie_export_allowed: false
  spec: providers/gemini.md

mcp:
  readme: mcp/README.md

registered_projects:
  - van
  - dial
  - dde
  - gtr
  - goat
  - aeci
