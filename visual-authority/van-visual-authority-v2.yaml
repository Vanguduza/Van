aura_v2:
  revision: "2.1"
  thesis: "VAN is a solid expressive character surrounded by a living refractive field. When interface space is needed, that field condenses into glass."
  full_ring_forbidden: true
  max_single_arc_degrees: 110
  max_total_arc_degrees: 220
  filaments:
    min_count: 2
    max_count: 5
  overlay:
    resting_hit_dp: 104
    resting_avatar_dp: 92
    compact_width_dp: 280
    van_glass_overlap_dp: 20
    compact_actions: [Ask, Projects, Tasks, Decisions]
    dock_hit_dp: 88
    dock_character_dp: 76
  states: [OFFLINE, CONNECTING, IDLE, ATTENTIVE, LISTENING, THINKING, SEARCHING, WORKING, DELEGATING, SPEAKING, WAITING, WAITING_FOR_OWNER, DEGRADED, WARNING, ERROR, SUCCESS, URGENT, SLEEPING]
  actions: [HELLO_WAVE, ACK_NOD, POINT_LEFT, POINT_RIGHT, POINT_UP, POINT_DOWN, POINT_TARGET, CELEBRATE, CAUTION, CONFIRM, SHRUG, PRESENT_CARD, OPEN_PANEL, CLOSE_PANEL]
