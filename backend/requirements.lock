# GAP-F-017 — the exact-pinned closure of backend/requirements.txt.
#
# backend/requirements.txt stays the human-readable spec (what the gateway needs and why,
# with the loosest bound a maintainer would accept). This file is what actually gets
# installed on every host and in CI: every line is `==`, including every transitive
# dependency, so two installs from the same commit resolve to the same bytes — the
# `requirements-vm.txt` discipline the trading VM already has (deploy/van-trading-core),
# now on the gateway side too.
#
# Regenerate after a `backend/requirements.txt` change:
#   python -m venv /tmp/van-lock && /tmp/van-lock/bin/pip install -r backend/requirements.txt
#   /tmp/van-lock/bin/pip freeze > backend/requirements.lock
# then re-add this header and re-sort. `tests/contracts/test_backend_dependencies_are_pinned.py`
# is the contract: every line here is `==`-pinned, and every package
# `backend/requirements.txt` names appears here.
